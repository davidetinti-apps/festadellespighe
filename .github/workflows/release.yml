# Rilascio: a ogni push su master release-please aggiorna la PR di release (versione e changelog dai prefissi dei
# commit: fix: → patch, feat: → minor, feat!: → major). Unire quella PR crea il tag vX.Y.Z: allora girano i test su
# quel tag, si costruisce l'immagine ghcr.io/<repo>:vX.Y.Z e il runner del server la pubblica. Se un passo fallisce i
# successivi non partono.
name: release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  test:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}

  image:
    needs: [release-please, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ needs.release-please.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [release-please, image]
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}
