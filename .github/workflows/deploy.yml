# Deploy: gira sul server (runner "home1" dell'organizzazione, che accetta solo questo file sul ramo master) e lancia
# app-deploy, che scarica l'immagine della versione, riavvia il sito, controlla che risponda e,
# se qualcosa non va, torna alla versione precedente. Il runner non ha accesso a Docker: può solo lanciare app-deploy.
# Lo richiama release.yml; a mano (Actions → deploy → Run workflow) ripubblica una versione già rilasciata, es. per
# tornare indietro.
name: deploy

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Versione da pubblicare (es. v0.2.0)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, home1]
    timeout-minutes: 20
    environment: prod
    concurrency:
      group: deploy-festadellespighe
      cancel-in-progress: false
    steps:
      - run: sudo -n /usr/local/bin/app-deploy festadellespighe "$REF"
        env:
          REF: ${{ inputs.ref }}
