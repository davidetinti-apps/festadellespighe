name: Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment da usare per il deploy"
        required: false
        default: prod
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CONTAINER_NAME: festadellespighe
  APP_PORT: ${{ vars.APP_PORT || secrets.APP_PORT }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment || 'prod' }}

    steps:
      - name: Validate deploy configuration
        env:
          SSH_HOST: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER || secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ vars.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ vars.GHCR_TOKEN || secrets.GHCR_TOKEN }}
          APP_PORT: ${{ vars.APP_PORT || secrets.APP_PORT || '3000' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR || '$HOME/festadellespighe' }}
        run: |
          set -e
          missing=0

          for key in SSH_HOST SSH_USER SSH_PRIVATE_KEY GHCR_USERNAME GHCR_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing $key. Add it as Repository Variable or Secret."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Deploy configuration looks valid. APP_PORT=${APP_PORT} DEPLOY_DIR=${DEPLOY_DIR}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ vars.GHCR_TOKEN || secrets.GHCR_TOKEN }}
        with:
          host: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
          username: ${{ vars.SSH_USER || secrets.SSH_USER }}
          key: ${{ vars.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || secrets.SSH_PORT || 22 }}
          envs: IMAGE_NAME,CONTAINER_NAME,APP_PORT,DEPLOY_DIR,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e

            APP_PORT="${APP_PORT:-3000}"
            DEPLOY_DIR="${DEPLOY_DIR:-$HOME/festadellespighe}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "Docker Compose non trovato sul server"
              exit 1
            fi

            mkdir -p "$DEPLOY_DIR"
            cat > "$DEPLOY_DIR/docker-compose.yml" <<EOF
            services:
              app:
                image: ${IMAGE_NAME}:latest
                container_name: ${CONTAINER_NAME}
                restart: unless-stopped
                ports:
                  - "${APP_PORT}:${APP_PORT}"
                environment:
                  PORT: "${APP_PORT}"
            EOF

            cd "$DEPLOY_DIR"
            $DC pull
            $DC up -d --remove-orphans

            docker image prune -f
